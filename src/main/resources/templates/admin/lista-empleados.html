<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Empleados</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4">Lista de Empleados</h2>

    <a th:href="@{/admin/nuevo-empleado}" class="btn btn-primary mb-3">Crear nuevo empleado</a>

    <table class="table table-bordered">
        <thead class="thead-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="empleado : ${empleados}">
                <td th:text="${empleado.id}">1</td>
                <td th:text="${empleado.nombre}">Nombre</td>
                <td th:text="${empleado.email}">correo@example.com</td>
                <td th:text="${empleado.rol}">rol</td>
                <td>
                    <a th:href="@{'/admin/editar-empleado/' + ${empleado.id}}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{'/admin/eliminar-empleado/' + ${empleado.id}}" 
                       class="btn btn-danger btn-sm" 
                       onclick="return confirm('¿Estás seguro de que quieres eliminar este empleado?');">
                        Eliminar
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
