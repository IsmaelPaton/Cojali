<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inicio - Jefe de Taller</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/estilos.css"> <!-- si tienes un CSS personalizado -->
</head>
<body>
<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0 text-center">Panel del Jefe de Taller</h2>
        </div>
        <div class="card-body">
            <p class="lead text-center">Bienvenido al sistema de gestión del taller. ¿Qué desea hacer hoy?</p>

            <div class="list-group">
                <a th:href="@{/empleados/listar}" class="list-group-item list-group-item-action">
                    👥 Gestionar empleados
                </a>
                <a th:href="@{/admin/asignar-reservas}" class="list-group-item list-group-item-action">
                    🛠️ Asignar reservas a mecánicos
                </a>
                <a th:href="@{/admin/estadisticas}" class="list-group-item list-group-item-action">
                    📊 Ver estadísticas y valoraciones
                </a>
                <a th:href="@{/admin/facturas}" class="list-group-item list-group-item-action">
                    🧾 Ver todas las facturas
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
