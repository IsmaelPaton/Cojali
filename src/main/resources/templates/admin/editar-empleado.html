<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Empleado</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4">Editar Empleado</h2>

    <form th:action="@{/admin/actualizar-empleado}" th:object="${empleado}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label>Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control" required />
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" class="form-control" required />
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <input type="text" th:field="*{contraseña}" class="form-control" required />
        </div>

        <div class="form-group">
            <label>Rol</label>
            <select th:field="*{rol}" class="form-control" required>
                <option value="recepcionista" th:selected="${empleado.rol == 'recepcionista'}">Recepcionista</option>
                <option value="mecanico" th:selected="${empleado.rol == 'mecanico'}">Mecánico</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Guardar Cambios</button>
        <a th:href="@{/admin/lista-empleados}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
